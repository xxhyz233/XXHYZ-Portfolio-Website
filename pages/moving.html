<html lang="en">

        <link rel="stylesheet" href="../css/style.css"/>
        <link rel="stylesheet" href="../css/site.css?v=2">
        <!--Google Fonts import-->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">

    <body>
        <custom-header></custom-header>
        <div class="page-content" id="main-content">
            <h1 class="content-title loadAni">MOVING</h1>
            <p class="description loadAni">Experimental motion graphics and effects created with various tools.</p>
            <br/>
            <div class="container">
                <div class="column two-Columns">
                    <div class="column-item loadAni">
                        <div class="archive-video">
                            <a href="https://www.youtube.com/watch?v=EtN1sA-gI9Y" data-youtube-id="EtN1sA-gI9Y" data-player-title="Dimensionalize Nervous Breakdown" aria-label="Play Dimensionalize Nervous Breakdown">PLAY</a>
                        </div>
                        <p class="caption"><a href="https://www.youtube.com/watch?v=EtN1sA-gI9Y">Watch on YouTube</a></p>
                    </div>
                </div>
                <div class="column two-Columns">
                    <div class="column-item loadAni">
                        <div class="column-item loadAni">
                            <video loading="lazy" class="small-video" width="1920" height="1080" data-viewport-autoplay preload="none" playsinline loop muted><source src="../media/videos/art/dimensionalize/motion-study.mp4"></video>
                        </div>
                    </div>
                </div>
            </div>
            <!--1st Container for Heliov-->
            <div class="container">
                <div class="column two-Columns">
                    <div class="column-item loadAni">
                        <div class="archive-video">
                            <a href="https://www.youtube.com/watch?v=HwzxmlSyk2M" data-youtube-id="HwzxmlSyk2M" data-player-title="Heliov" aria-label="Play Heliov">PLAY</a>
                        </div>
                        <p class="caption"><a href="https://www.youtube.com/watch?v=HwzxmlSyk2M">Watch on YouTube</a></p>
                    </div>
                </div>
                <div class="column two-Columns">
                    <div class="column-item loadAni">
                        <div class="column-item loadAni">
                            <video loading="lazy" class="small-video" width="1920" height="810" data-viewport-autoplay preload="none" playsinline loop muted><source src="../media/videos/motion-studies/heliov-grid.mp4"></video>
                        </div>
                    </div>
                </div>
            </div>
            <div class="container">
                <div class="column two-Columns">
                    <div class="column-item loadAni">
                        <video loading="lazy" class="small-video" width="1920" height="1080" data-viewport-autoplay preload="none" playsinline loop muted><source src="../media/videos/motion-studies/glitchy.mp4"></video>
                        <p class="caption"></p>
                    </div>
                    <div class="column-item loadAni">
                        <video loading="lazy" class="small-video" width="1920" height="810" data-viewport-autoplay preload="none" playsinline loop muted><source src="../media/videos/motion-studies/point-cloud-test.mp4"></video>
                        <p class="caption">Point Cloud Experiment</p>
                    </div>
                    <div class="column-item loadAni">
                        <video loading="lazy" class="small-video" width="1280" height="720" data-viewport-autoplay preload="none" playsinline loop muted><source src="../media/videos/motion-studies/cytus.mp4"></video>
                        <p class="caption">Cytus 2 Reference</p>
                    </div>
                </div>
                <div class="column two-Columns">   
                    <div class="column-item loadAni">
                        <video loading="lazy" class="big-video" width="1920" height="1080" controls data-viewport-autoplay preload="none" playsinline muted><source src="../media/videos/motion-studies/zhongjianhui.mp4"></video>

                    </div>
                    <div class="column-item loadAni">
                        <video loading="lazy" class="small-video" width="1920" height="816" data-viewport-autoplay preload="none" playsinline loop muted><source src="../media/videos/motion-studies/time-traveller.mp4"></video>
                    </div>
                    <div class="column-item loadAni">

                    </div>
                </div>
            </div>  
            <custom-footer></custom-footer>
        </div>
        <!-- Overlay of image when clicked -->
        <div class="fullscreen-view">
            <span class="close">&times;</span>
            <img class="fullscreen-image" src="" alt="Fullscreen Image">
            <video class="fullscreen-video" src="" alt="Fullscreen Image">
        </div>
